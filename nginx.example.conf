# =========================================================================
# nginx reverse-proxy config for FIT-TAX Cakrawala Sinergi (Hostinger VPS)
# =========================================================================
# On Hostinger VPS with the Node.js app running on port 3000 (via PM2),
# place this in /etc/nginx/sites-available/cakrawala and symlink it into
# sites-enabled. Then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace `cakrawalaintiteknik.com` with your real domain and make sure
# SSL is set up (Hostinger's auto-SSL or `sudo certbot --nginx`).
# -------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name cakrawalaintiteknik.com www.cakrawalaintiteknik.com;

    # Redirect all HTTP to HTTPS (comment out until SSL is active)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cakrawalaintiteknik.com www.cakrawalaintiteknik.com;

    # SSL certificates — Hostinger places these under /etc/ssl/ or via the panel.
    # With certbot: ssl_certificate /etc/letsencrypt/live/cakrawalaintiteknik.com/fullchain.pem;
    #               ssl_certificate_key /etc/letsencrypt/live/cakrawalaintiteknik.com/privkey.pem;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Redirect www -> non-www (optional)
    if ($host = www.cakrawalaintiteknik.com) {
        return 301 https://cakrawalaintiteknik.com$request_uri;
    }

    # Upload size limit — must be >= the 4 MB upload cap in the app.
    client_max_body_size 8M;

    # Proxy to the Next.js standalone server (PM2, port 3000).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE support (future-proofing).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache static Next.js assets aggressively.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache uploaded images (served via the /uploads catch-all route).
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
